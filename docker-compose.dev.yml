version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: odoo20_ai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  chroma:
    image: chromadb/chroma:latest
    container_name: odoo20_ai_chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  redis_data:
  chroma_data:
